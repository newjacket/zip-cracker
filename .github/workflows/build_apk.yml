name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Increase swap memory
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile /mnt/swapfile || true
        sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        echo "✅ 交换内存已增加到8GB"
        free -h


    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-pip python3-dev autoconf libtool pkg-config libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake zip unzip wget zlib1g-dev ccache libltdl-dev
        echo "✅ 系统依赖安装完成"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36
        pip install buildozer
        echo "✅ Python依赖安装完成"
        buildozer --version

    - name: Build APK
      run: |
        set -o pipefail
        cd android
        ls -la
        echo "🔨 开始构建APK..."
        buildozer android debug 2>&1 | tee build.log | tail -200
        echo ""
        ls -la bin/ 2>/dev/null || echo "bin目录不存在"
        if [ ! -f bin/*.apk ]; then
          echo "❌ 错误：APK文件未生成！"
          tail -150 build.log
          exit 1
        fi
        echo "✅ APK构建成功！"

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: android/build.log
        retention-days: 7

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: zip-cracker-apk
        path: android/bin/*.apk
        retention-days: 30
