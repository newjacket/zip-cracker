name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3 python3-pip python3-dev autoconf libtool pkg-config libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake zip unzip wget zlib1g-dev ccache
        pip3 install --upgrade pip
        pip3 install buildozer cython==0.29.33

    - name: Build APK
      run: |
        cd android
        yes | buildozer android sdkmanager --licenses || true
        buildozer android debug 2>&1 | tail -100

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: zip-cracker-apk
        path: android/bin/*.apk
        retention-days: 30
